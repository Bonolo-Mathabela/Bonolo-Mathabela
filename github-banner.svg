<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="Welcome To My Digital Space" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Welcome To My Digital Space</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E6EFE7"/>
      <stop offset="0.55" stop-color="#EEF2EC"/>
      <stop offset="1" stop-color="#F3E6E3"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.35" stop-color="#FCE3E1"/>
      <stop offset="0.75" stop-color="#F9B9B6"/>
      <stop offset="1" stop-color="#F7A5A3"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD6D3" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFD6D3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloudA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF4EE"/>
    </linearGradient>
    <linearGradient id="cloudB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F8F3"/>
      <stop offset="1" stop-color="#E3ECE3"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7A5A3" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#F7A5A3" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="fadeBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6F9F5" stop-opacity="0"/>
      <stop offset="1" stop-color="#F6F9F5" stop-opacity="1"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <filter id="shadow" x="-10%" y="-30%" width="120%" height="160%">
      <feDropShadow dx="0" dy="-4" stdDeviation="8" flood-color="#B9CBB9" flood-opacity="0.35"/>
    </filter>
    <clipPath id="card"><rect width="1280" height="420" rx="28"/></clipPath>

    <style>
      .font { font-family: "Inter", "SF Pro Display", -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }

      /* Sun rises from behind the clouds, then breathes */
      .sun { transform-box: fill-box; transform-origin: center;
             animation: rise 2.6s cubic-bezier(.2,.7,.2,1) both, breathe 7s ease-in-out 2.6s infinite; }
      @keyframes rise { from { transform: translateY(170px) scale(.9); opacity: 0; } to { transform: none; opacity: 1; } }
      @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.025); } }

      .glow { animation: glowPulse 6s ease-in-out infinite; }
      @keyframes glowPulse { 0%,100% { opacity: .6; } 50% { opacity: 1; } }

      /* Clouds roll in, then drift */
      .cloudsBack  { animation: inLeft 2.2s cubic-bezier(.2,.7,.2,1) both, driftA 18s ease-in-out 2.2s infinite; }
      .cloudsFront { animation: inUp 2s cubic-bezier(.2,.7,.2,1) .2s both, driftB 14s ease-in-out 2.2s infinite; }
      @keyframes inLeft { from { transform: translate(-60px, 60px); opacity: 0; } to { transform: none; opacity: 1; } }
      @keyframes inUp   { from { transform: translateY(90px); opacity: 0; } to { transform: none; opacity: 1; } }
      @keyframes driftA { 0%,100% { transform: translateX(0); } 50% { transform: translateX(28px); } }
      @keyframes driftB { 0%,100% { transform: translateX(0); } 50% { transform: translateX(-22px); } }

      /* Launch trail shoots up through the sun */
      .trail { transform-box: fill-box; transform-origin: bottom center;
               animation: launch 3.2s cubic-bezier(.5,0,.2,1) 2.4s both; }
      @keyframes launch { 0% { transform: scaleY(0); opacity: 0; } 25% { opacity: 1; } 70% { transform: scaleY(1); opacity: .9; } 100% { transform: scaleY(1) translateY(-40px); opacity: 0; } }
      .spark { animation: spark 3.2s cubic-bezier(.5,0,.2,1) 2.4s both; }
      @keyframes spark { 0% { transform: translateY(0); opacity: 0; } 20% { opacity: 1; } 75% { opacity: 1; } 100% { transform: translateY(-300px); opacity: 0; } }

      /* Cover clouds: fill the frame, then part to reveal the words */
      .coverL { animation: partL 2.8s cubic-bezier(.65,0,.25,1) .5s both; }
      .coverR { animation: partR 2.8s cubic-bezier(.65,0,.25,1) .5s both; }
      .coverM { animation: partM 2.6s cubic-bezier(.65,0,.25,1) .6s both; }
      @keyframes partL { 0% { transform: none; opacity: 1; } 80% { opacity: 1; } 100% { transform: translate(-760px, 60px) scale(1.15); opacity: 0; } }
      @keyframes partR { 0% { transform: none; opacity: 1; } 80% { opacity: 1; } 100% { transform: translate(760px, 60px) scale(1.15); opacity: 0; } }
      @keyframes partM { 0% { transform: none; opacity: 1; } 75% { opacity: 1; } 100% { transform: translateY(380px); opacity: 0; } }

      /* Word-by-word blur reveal */
      .w { opacity: 0; animation: reveal 1.1s cubic-bezier(.2,.7,.2,1) both; }
      @keyframes reveal { from { opacity: 0; transform: translateY(14px); filter: blur(10px); } to { opacity: 1; transform: none; filter: blur(0); } }
      .w1 { animation-delay: 1.3s; }  .w2 { animation-delay: 1.5s; } .w3 { animation-delay: 1.7s; }
      .w4 { animation-delay: 1.95s; } .w5 { animation-delay: 2.2s; }
      .eyebrow { animation-delay: 1.1s; }

      /* Light words shimmer softly once settled */
      .light { animation: reveal 1.1s cubic-bezier(.2,.7,.2,1) 2.2s both, shimmer 5s ease-in-out 3.8s infinite; }
      @keyframes shimmer { 0%,100% { fill: #A9AFA9; } 50% { fill: #E89896; } }

      .dot { animation: blink 2.4s ease-in-out infinite; }
      @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .25; } }

      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; opacity: 1 !important; transform: none !important; filter: none !important; }
      }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="420" fill="url(#bg)"/>

    <!-- glow + sun -->
    <circle class="glow" cx="640" cy="350" r="330" fill="url(#glow)"/>
    <circle class="sun" cx="640" cy="372" r="210" fill="url(#sun)"/>

    <!-- launch trail -->
    <rect class="trail" x="636" y="120" width="8" height="250" rx="4" fill="url(#trail)" filter="url(#soft)"/>
    <circle class="spark" cx="640" cy="360" r="5" fill="#FFFFFF"/>

    <!-- back clouds -->
    <g transform="translate(640 430) scale(1.55) translate(-640 -430)">
    <g class="cloudsBack" fill="url(#cloudB)" filter="url(#shadow)">
      <circle cx="40"  cy="380" r="90"/>
      <circle cx="150" cy="360" r="80"/>
      <circle cx="260" cy="395" r="70"/>
      <circle cx="1030" cy="380" r="80"/>
      <circle cx="1140" cy="330" r="110"/>
      <circle cx="1260" cy="300" r="95"/>
      <rect x="-40" y="390" width="1360" height="60"/>
    </g>

    <!-- front clouds -->
    <g class="cloudsFront" fill="url(#cloudA)" filter="url(#shadow)">
      <circle cx="330" cy="420" r="72"/>
      <circle cx="430" cy="405" r="60"/>
      <circle cx="520" cy="420" r="52"/>
      <circle cx="600" cy="432" r="40"/>
      <circle cx="690" cy="430" r="44"/>
      <circle cx="770" cy="418" r="50"/>
      <circle cx="880" cy="400" r="78"/>
      <circle cx="990" cy="420" r="66"/>
      <circle cx="-10" cy="430" r="70"/>
      <circle cx="1240" cy="430" r="70"/>
      <rect x="-40" y="425" width="1360" height="40"/>
    </g>
    </g>
    <rect y="330" width="1280" height="90" fill="url(#fadeBottom)" opacity="0.6"/>

    <!-- copy -->
    <g class="font" text-anchor="start">
      <g class="w eyebrow">
        <circle class="dot" cx="561" cy="70" r="3.5" fill="#E89896"/>
        <text x="572" y="76" font-size="17" fill="#5E655E" letter-spacing="0.4">Bonolo Mathabela</text>
      </g>

      <!-- Line 1 -->
      <text x="346" y="166" font-size="84" letter-spacing="-2.8" fill="#3F4540" class="w w1">Welcome</text>
      <text x="709" y="166" font-size="84" letter-spacing="-2.8" fill="#3F4540" class="w w2">To</text>
      <text x="816" y="166" font-size="84" letter-spacing="-2.8" fill="#3F4540" class="w w3">My</text>
      <!-- Line 2 -->
      <text x="400" y="252" font-size="84" letter-spacing="-2.8" fill="#3F4540" class="w w4">Digital</text>
      <text x="643" y="252" font-size="84" letter-spacing="-2.8" fill="#A9AFA9" class="light">Space</text>
    </g>

    <!-- cover clouds (part to reveal the headline) -->
    <g fill="url(#cloudA)" filter="url(#shadow)">
      <g class="coverM">
        <circle cx="640" cy="290" r="200"/>
        <circle cx="500" cy="400" r="160"/>
        <circle cx="780" cy="400" r="160"/>
      </g>
      <g class="coverL">
        <circle cx="80"  cy="330" r="170"/>
        <circle cx="250" cy="340" r="180"/>
        <circle cx="120" cy="110" r="200"/>
        <circle cx="330" cy="50"  r="175"/>
        <circle cx="420" cy="230" r="190"/>
        <circle cx="560" cy="130" r="175"/>
      </g>
      <g class="coverR">
        <circle cx="1200" cy="330" r="170"/>
        <circle cx="1030" cy="340" r="180"/>
        <circle cx="1160" cy="110" r="200"/>
        <circle cx="950"  cy="50"  r="175"/>
        <circle cx="860"  cy="230" r="190"/>
        <circle cx="720"  cy="130" r="175"/>
      </g>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
